<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0d0b0a">
  <title>عروض الأسعار | مناديب الأصل للطاقة الشمسية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="rep-widgets.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="../supabase-config.js"></script>
  <script defer src="rep-quotes.js"></script>
  <style>
    #printArea { display: none; }
    @media print {
      body * { visibility: hidden; }
      #printArea, #printArea * { visibility: visible; }
      #printArea { display: block; position: absolute; top: 0; right: 0; left: 0; padding: 24px; direction: rtl; }
      .print-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #c8752d; padding-bottom: 12px; margin-bottom: 16px; }
      .print-header img { height: 55px; }
      .print-title { font-size: 20px; font-weight: 800; color: #17120f; }
      .print-meta { font-size: 13px; color: #555; margin-bottom: 16px; }
      .print-table { width: 100%; border-collapse: collapse; font-size: 13px; }
      .print-table th, .print-table td { border: 1px solid #e4d8ca; padding: 6px 8px; text-align: center; }
      .print-table th { background: #f3e4d4; }
      .print-totals { margin-top: 16px; font-size: 14px; width: 320px; margin-inline-start: auto; }
      .print-totals .row { display: flex; justify-content: space-between; padding: 4px 0; }
      .print-totals .grand { font-weight: 800; font-size: 17px; border-top: 2px solid #17120f; margin-top: 6px; padding-top: 8px; }
      .print-footer { margin-top: 30px; font-size: 12px; color: #777; }
    }
    .rq-cart-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .rq-cart-table th, .rq-cart-table td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: right; }
    .rq-cart-table th { color: var(--muted); font-size: 12px; }
    .rq-cart-table input[type="number"] { width: 64px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; }
    .rq-quote-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); gap: 8px; font-size: 14px; }
  </style>
</head>
<body>

<main class="dashboard-shell">
  <section class="dashboard-hero">
    <a class="dashboard-logo" href="index.html">
      <img src="../logo-white.png" alt="الأصل للطاقة الشمسية">
    </a>
    <div class="dashboard-hero-text">
      <a href="index.html" class="dashboard-home-btn" aria-label="بوابة المناديب">
        <i class="fa fa-house" aria-hidden="true"></i>
        <span>بوابة المناديب</span>
      </a>
      <p class="eyebrow" style="margin-bottom:2px">بوابة المناديب</p>
      <h1>عروض أسعار المنتجات</h1>
    </div>
  </section>

  <section class="dashboard-card" data-auth-panel style="max-width:420px;text-align:center">
    <h2>تسجيل دخول المندوب</h2>
    <form class="admin-form" data-login-form>
      <label for="loginEmail">البريد الإلكتروني</label>
      <input type="email" id="loginEmail" required autocomplete="username">
      <label for="loginPassword">كلمة المرور</label>
      <input type="password" id="loginPassword" required autocomplete="current-password">
      <button type="submit" class="btn btn-primary">دخول</button>
      <p class="form-note" data-auth-message></p>
    </form>
  </section>

  <div class="rep-main" data-rep-panel hidden style="max-width:820px;padding-top:0">

    <div class="dashboard-toolbar" style="position:static">
      <div>
        <h2 style="margin:0;font-size:18px" data-user-name>—</h2>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <a href="rep-offgrid-quote.html" class="btn btn-secondary" style="text-decoration:none">حاسبة أوف جريد</a>
        <a href="rep-pump-calculator.html" class="btn btn-secondary" style="text-decoration:none">حاسبة الري</a>
        <button class="btn btn-secondary dark" data-logout>تسجيل خروج</button>
      </div>
    </div>

    <div class="card">
      <h3>بيانات العميل</h3>
      <div class="row2">
        <div><label>اسم العميل</label><input type="text" id="custName" required></div>
        <div><label>رقم التليفون</label><input type="tel" id="custPhone" required placeholder="01xxxxxxxxx"></div>
      </div>
      <label>المدينة / المنطقة</label>
      <input type="text" id="custCity">
    </div>

    <div class="card">
      <h3>نوع العرض</h3>
      <div class="seg">
        <button type="button" class="active" data-quote-type="supply_only">توريد فقط</button>
        <button type="button" data-quote-type="supply_install">توريد وتركيب</button>
      </div>
      <div class="rw-field" data-install-cost-wrap hidden style="margin-top:var(--space-2)">
        <label>تكلفة التركيب (تُضاف للإجمالي)</label>
        <input type="number" id="installCost" min="0" step="1" value="0">
      </div>
    </div>

    <div class="card">
      <h3>إضافة منتجات للعرض</h3>
      <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">
        <select id="categorySelect" style="flex:1;min-width:140px"></select>
        <select id="productSelect" style="flex:2;min-width:200px"></select>
        <input type="number" id="qtyInput" min="1" value="1" style="max-width:80px">
        <button type="button" class="btn btn-primary" id="addProductBtn" style="min-height:44px">إضافة</button>
      </div>
      <table class="rq-cart-table">
        <thead><tr><th>المنتج</th><th>سعر الوحدة</th><th>الكمية</th><th>الإجمالي</th><th></th></tr></thead>
        <tbody id="cartBody"></tbody>
      </table>
      <div class="totalbar" style="flex-direction:column;gap:6px;align-items:flex-start;padding:14px 18px">
        <div style="font-size:14px;color:rgba(255,255,255,.75)">الإجمالي قبل التركيب: <strong id="subtotalDisplay" class="num">0</strong> ج.م</div>
        <div data-install-total-row hidden style="font-size:14px;color:rgba(255,255,255,.75)">تكلفة التركيب: <strong id="installTotalDisplay" class="num">0</strong> ج.م</div>
        <div class="big num">الإجمالي الكلي: <span id="grandTotalDisplay">0</span> ج.م</div>
      </div>
      <button type="button" class="btn btn-primary" id="saveQuoteBtn" style="width:100%;margin-top:16px">
        <i class="fa-solid fa-print"></i> حفظ العرض وطباعته
      </button>
      <p class="form-note" data-quote-message></p>
    </div>

    <div class="card">
      <h3>عروضي السابقة</h3>
      <div id="myQuotesList"></div>
    </div>

  </div>
</main>

<div id="printArea"></div>

</body>
</html>
